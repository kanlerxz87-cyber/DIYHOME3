name: Independent source and identity audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python release_checks/e10111d6/check.py
      - run: python -m unittest discover -s release_checks/e10111d6 -v
